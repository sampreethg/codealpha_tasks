<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | AuraStore</title>
  <meta name="description" content="Sign in to your AuraStore account to access your orders, saved items, and personalized e-commerce dashboard.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="navbar-header">
    <div class="container">
      <nav class="navbar" aria-label="Main Navigation">
        <a href="index.html" class="logo" id="brandLogo">
          <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </div>
          <span>Aura<span class="logo-accent">Store</span></span>
        </a>

        <div class="nav-menu" id="navMenu">
          <ul class="nav-links">
            <li><a href="index.html" class="nav-link" id="navHome">Home</a></li>
            <li><a href="index.html#shop" class="nav-link" id="navShop">Shop</a></li>
          </ul>

          <div class="nav-actions">
            <a href="cart.html" class="cart-icon-btn" id="navCart" title="Shopping Cart">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
              </svg>
              <span class="cart-badge" id="cartCount">0</span>
            </a>

            <a href="login.html" class="btn btn-secondary active" id="navLogin">Log In</a>
            <a href="register.html" class="btn btn-primary" id="navRegister">Sign Up</a>
          </div>
        </div>

        <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation menu" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="main-content flex items-center justify-center">
    <div class="auth-wrapper">
      <div class="auth-card">
        
        <div class="auth-header">
          <h1>Welcome Back</h1>
          <p>Please enter your credentials to access your account</p>
        </div>

        <form id="loginForm" novalidate>
          
          <div class="form-group">
            <label for="loginEmail" class="form-label">Email Address</label>
            <div class="input-wrapper">
              <input 
                type="email" 
                id="loginEmail" 
                name="email" 
                class="form-control" 
                placeholder="name@domain.com"
                autocomplete="email" 
                required
              >
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="loginPassword" class="form-label">Password</label>
            <div class="input-wrapper">
              <input 
                type="password" 
                id="loginPassword" 
                name="password" 
                class="form-control" 
                placeholder="••••••••"
                autocomplete="current-password" 
                required
              >
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" id="rememberMe" name="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="#forgot" class="forgot-link" id="forgotPassword">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="loginSubmitBtn">
            <span>Sign In</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account yet? <a href="register.html" id="linkToRegister">Sign up here</a>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 AuraStore Technologies Inc. All rights reserved.</p>
        <p>Built with Vanilla HTML5, CSS3, and JavaScript.</p>
      </div>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="cart.js"></script>
</body>
</html>
