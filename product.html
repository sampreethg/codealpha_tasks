<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | AuraStore</title>
  <meta name="description" content="View detailed specs, high-res images, features, and pricing for AuraStore products.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="navbar-header">
    <div class="container">
      <nav class="navbar" aria-label="Main Navigation">
        <a href="index.html" class="logo" id="brandLogo">
          <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </div>
          <span>Aura<span class="logo-accent">Store</span></span>
        </a>

        <div class="nav-menu" id="navMenu">
          <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="index.html#shop" class="nav-link">Shop Catalog</a></li>
          </ul>

          <div class="nav-actions">
            <a href="cart.html" class="cart-icon-btn" id="navCart" title="View Cart">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
              </svg>
              <span class="cart-badge" id="cartCount">0</span>
            </a>

            <a href="login.html" class="btn btn-secondary">Log In</a>
            <a href="register.html" class="btn btn-primary">Sign Up</a>
          </div>
        </div>

        <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation menu" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="padding-top: 2rem; padding-bottom: 5rem;">
      
      <nav class="breadcrumb" aria-label="Breadcrumb navigation">
        <a href="index.html">Home</a>
        <span class="sep">/</span>
        <a href="index.html#shop">Shop</a>
        <span class="sep">/</span>
        <span id="breadcrumbCategory" class="current">Category</span>
        <span class="sep">/</span>
        <span id="breadcrumbName" class="current">Product Details</span>
      </nav>

      <div id="productDetailContainer">
        <div class="text-center" style="padding: 5rem 0; color: var(--text-muted);">
          Loading product specifications...
        </div>
      </div>

      <div class="related-products-section" style="margin-top: 5rem; border-top: 1px solid var(--border-color); padding-top: 3rem;">
        <h2 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 2rem;">You Might Also Like</h2>
        <div class="product-grid" id="relatedProductsGrid"></div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 AuraStore Technologies Inc. All rights reserved.</p>
        <p>Built with Vanilla HTML5, CSS3, and JavaScript.</p>
      </div>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="cart.js"></script>
  <script src="products.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      let productId = urlParams.get('id');

      if (!productId) {
        productId = 'prod_001';
      }

      const product = await window.ProductApp.productService.getProductById(productId);
      const container = document.getElementById('productDetailContainer');

      if (!product) {
        container.innerHTML = `
          <div class="text-center" style="padding: 4rem 1rem;">
            <h2>Product Not Found</h2>
            <p style="color: var(--text-muted); margin: 1rem 0 2rem;">The requested product could not be located in our catalog.</p>
            <a href="index.html#shop" class="btn btn-primary">Return to Shop</a>
          </div>
        `;
        return;
      }

      document.title = `${product.name} | AuraStore`;
      document.getElementById('breadcrumbCategory').textContent = product.category;
      document.getElementById('breadcrumbName').textContent = product.name;

      const savings = product.originalPrice ? (product.originalPrice - product.price).toFixed(2) : null;
      const featuresListHtml = (product.features || []).map(f => `
        <li>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          <span>${f}</span>
        </li>
      `).join('');

      container.innerHTML = `
        <div class="product-editorial-grid">
          <div class="product-gallery">
            <div class="main-image-stage">
              ${product.badge ? `<span class="product-card-badge">${product.badge}</span>` : ''}
              <img id="mainProductImg" src="${product.image}" alt="${product.name}" />
            </div>
            <div class="gallery-thumbnails">
              <button type="button" class="thumb-btn active"><img src="${product.image}" alt="Thumb 1" /></button>
              <button type="button" class="thumb-btn"><img src="${product.image}" alt="Thumb 2" /></button>
              <button type="button" class="thumb-btn"><img src="${product.image}" alt="Thumb 3" /></button>
            </div>
          </div>

          <div class="product-info-panel">
            <span class="product-category-tag">${product.category}</span>
            <h1 class="editorial-title">${product.name}</h1>
            
            <div class="rating-strip">
              <span class="stars">★★★★★</span>
              <span class="rating-score">${product.rating}</span>
              <span class="reviews-count">(${product.reviewsCount} verified reviews)</span>
            </div>

            <div class="price-display-box">
              <span class="current-price">$${product.price.toFixed(2)}</span>
              ${product.originalPrice ? `<span class="was-price">$${product.originalPrice.toFixed(2)}</span>` : ''}
              ${savings ? `<span class="savings-tag">Save $${savings}</span>` : ''}
            </div>

            <p class="product-lead-desc">${product.description}</p>

            <ul class="features-bullets">
              ${featuresListHtml}
            </ul>

            <div class="purchase-action-box">
              <div class="quantity-picker">
                <button type="button" class="qty-btn" id="qtyMinusBtn" aria-label="Decrease quantity">-</button>
                <input type="number" id="qtyInput" value="1" min="1" max="99" readonly />
                <button type="button" class="qty-btn" id="qtyPlusBtn" aria-label="Increase quantity">+</button>
              </div>

              <button type="button" class="btn btn-primary btn-lg add-to-cart-action" id="addToCartPageBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                <span>Add to Cart</span>
              </button>
            </div>

            <div class="value-props">
              <div class="prop-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                <span>Free Express Delivery over $99</span>
              </div>
              <div class="prop-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>2-Year Manufacturer Warranty</span>
              </div>
              <div class="prop-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                <span>30-Day Hassle-Free Returns</span>
              </div>
            </div>

          </div>
        </div>
      `;

      const qtyInput = document.getElementById('qtyInput');
      document.getElementById('qtyMinusBtn').onclick = () => {
        const val = Math.max(1, parseInt(qtyInput.value, 10) - 1);
        qtyInput.value = val;
      };
      document.getElementById('qtyPlusBtn').onclick = () => {
        const val = Math.min(99, parseInt(qtyInput.value, 10) + 1);
        qtyInput.value = val;
      };

      document.getElementById('addToCartPageBtn').onclick = () => {
        const qty = parseInt(qtyInput.value, 10) || 1;
        if (window.CartApp && window.CartApp.cart) {
          window.CartApp.cart.addToCart(product, qty);
        }
      };

      const allProducts = await window.ProductApp.productService.getProducts();
      const related = allProducts.filter(p => p.id !== product.id).slice(0, 3);
      if (window.ProductApp.renderProducts) {
        window.ProductApp.renderProducts(related, 'relatedProductsGrid');
      }
    });
  </script>
</body>
</html>
